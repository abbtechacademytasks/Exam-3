services:
  postgres:
    image: postgres:17
    container_name: exam-3-postgres
    environment:
      POSTGRES_DB: onlayn_magaza
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${EXAM3_DB_PASSWORD:?Set EXAM3_DB_PASSWORD before starting}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - exam3_data:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onlayn_magaza"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  exam3_data:
